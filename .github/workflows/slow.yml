# Manual only. Runs the slow tests now; later (roadmap) the full pipeline on a 5% stratified sample.
name: Slow tests

on:
  workflow_dispatch:

jobs:
  slow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install the locked environment
        run: uv sync --locked

      - name: Slow tests
        run: uv run pytest -m slow
