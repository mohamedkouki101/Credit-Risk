# Hooks for git commits. Kouki runs `uv run pre-commit install` once in the repo.
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.4  # keep in step with the ruff version in uv.lock
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-yaml
      - id: check-added-large-files
        args: [--maxkb=5120]  # block anything over 5 MB (data never goes in git)
