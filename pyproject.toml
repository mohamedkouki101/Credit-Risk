[project]
name = "credit-risk"
version = "0.1.0"
description = "Credit default prediction: WOE scorecard vs monotone LightGBM on Lending Club data"
readme = "README.md"
authors = [
    { name = "mohamedkouki101", email = "mohamed.kouki@supcom.ucar.tn" }
]
requires-python = ">=3.12"
dependencies = [
    "duckdb>=2.0.0",
    "fairlearn>=0.15.0",
    "fastapi>=0.162.2",
    "httpx>=0.28.1",
    "imbalanced-learn>=0.14.2",
    "jinja2>=3.1.6",
    "joblib>=1.6.0",
    "lightgbm>=4.7.0",
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "optbinning>=1.0.0",
    "pandas>=3.1.1",
    "pandera>=0.35.0",
    "pyarrow>=26.0.1",
    "pydantic>=2.14.3",
    "pyyaml>=6.0.3",
    "scikit-learn>=1.9.1",
    "scipy>=1.18.1",
    "shap>=0.54.1",
    "streamlit>=1.67.0",
    "uvicorn>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["phase1", "phase2"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "NPY", "RUF"]
# N806-style rules are not selected: X / X_train are the ML convention for feature matrices.

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
# Most ML libraries (lightgbm, optbinning, shap, sklearn) ship without type stubs.
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: long-running test (model fits, full data); excluded from CI by -m 'not slow'",
]

[dependency-groups]
dev = [
    "hypothesis>=6.170.15",
    "kaggle>=2.2.5",
    "mypy>=2.4.1",
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.4",
    "six>=1.17.0",
]
